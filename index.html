<title>萍小宝体重日记</title>
<style>
  :root{
    --primary:#e8a0c8;--primary-d:#d078b0;--primary-light:#eaf8ea;
    --bg:#fafef8;--card:#fff;
    --text:#302d38;--muted:#90a088;--line:#e2ddd8;--red:#e55858;--red-bg:#fef2f2;
    --shadow:0 2px 10px rgba(232,160,200,.10);--radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden;width:100%;}
  .wrap{max-width:520px;width:100%;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right));}
  header.top{background:linear-gradient(135deg,var(--primary),var(--gradientEnd,#f5c4d8));color:#fff;
    padding:calc(12px + env(safe-area-inset-top)) 0 14px;}
  /* 仅浏览器普通模式消除安全区分界；PWA全屏模式(standalone)保持原样 */
  @media (display-mode: browser){
    header.top{margin-top:calc(-1 * env(safe-area-inset-top));}
  }
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;position:relative;}
  .brand svg{width:25px;height:25px;}
  .tools{display:flex;gap:6px;flex-wrap:wrap;position:relative;}
  .btn{border:none;cursor:pointer;font-size:14px;font-family:inherit;border-radius:10px;
    padding:9px 12px;min-height:42px;display:inline-flex;align-items:center;gap:5px;font-weight:600;transition:background .15s,transform .12s;}
  .btn svg{width:16px;height:16px;}
  .btn-ghost{background:rgba(255,255,255,.18);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.3);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-d);}
  .btn:active{transform:scale(.96);}
  .btn-danger{background:var(--red-bg);color:var(--red);}
  .btn-sm{padding:8px 11px;min-height:40px;font-size:14px;border-radius:10px;}
  #backupBanner{display:none;background:#fff7e6;border:1px solid #ffe2a8;color:#9a6b00;
    padding:10px 14px;border-radius:12px;margin:12px 0 0;font-size:13px;}

  /* 概览卡片 */
  .overview{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:12px;}
  .overview h2{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .overview h2 svg{width:20px;height:20px;color:var(--primary);}
  .ov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .ov-item{text-align:center;background:var(--bg);border-radius:14px;padding:12px 4px;position:relative;}
  .ov-item .ov-val{font-size:20px;font-weight:800;line-height:1.1;}
  .ov-item .ov-val.current{color:var(--primary-d);}
  .ov-item .ov-val.target{color:#6366f1;}
  .ov-item .ov-val.diff{color:var(--diff-color,var(--muted));}
  .ov-item .ov-val.diff.down{color:var(--red);}
  .ov-item .ov-val.goal-done{color:#06d6a0;font-size:18px;animation:pulseGlow 2s ease infinite;}
  @keyframes pulseGlow{0%,100%{opacity:1;}50%{opacity:.65;}}
  .ov-item .ov-val.lost{color:var(--primary-d);}
  .ov-item .ov-val.lost.up{color:var(--red);}
  .ov-item .ov-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
  .ov-item.ov-goal{position:relative;cursor:pointer;transition:background .15s,transform .12s;}
  .ov-item.ov-goal:active{transform:scale(.96);}
  .ov-item.ov-goal:hover{background:rgba(236,72,153,.06);}
  .ov-edit{display:flex;flex-direction:column;gap:7px;align-items:center;width:100%;}
  .ov-edit input{width:84px;font-size:16px;font-family:inherit;padding:7px 8px;border:1px solid var(--line);
    border-radius:9px;text-align:center;color:var(--text);background:#fff;min-height:40px;}
  .ov-edit input:focus{outline:none;border-color:var(--primary);}
  .ov-ok{border:none;background:var(--primary);color:#fff;font-size:13px;font-weight:600;
    border-radius:9px;padding:7px 16px;min-height:38px;cursor:pointer;font-family:inherit;transition:background .15s,transform .12s;}
  .ov-ok:hover{background:var(--primary-d);}
  .ov-ok:active{transform:scale(.95);}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;margin-top:12px;}
  .card h3{margin:0 0 13px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .card h3 svg{width:19px;height:19px;color:var(--primary);}

  .form-row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:110px;}
  .field label{font-size:13px;color:var(--muted);font-weight:600;}
  .field input,.field select{font-size:16px;font-family:inherit;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--text);width:100%;min-height:46px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--primary);}

  .list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);margin-bottom:7px;}
  .list-main{flex:1;}
  .list-main .t{font-size:15px;font-weight:600;}
  .list-main .s{font-size:13px;color:var(--muted);}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--primary-light);color:var(--primary-d);font-weight:600;margin-left:6px;}
  .tag.fat{background:#eef2ff;color:#4f46e5;}
  .del{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;min-height:40px;}
  .del:hover{color:var(--red);background:var(--red-bg);}
  .del svg{width:18px;height:18px;}

  /* 日历打卡 */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .cal-nav .nav-btn{border:1.5px solid var(--line);background:#fff;cursor:pointer;padding:7px 12px;border-radius:10px;
    min-height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;color:var(--primary);
    font-size:16px;font-weight:700;font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .cal-nav .nav-btn:hover{background:var(--light);border-color:var(--primary);transform:scale(1.04);}
  .cal-nav .nav-btn:active{transform:scale(.92);box-shadow:none;}
  .cal-nav .cal-title{font-size:16px;font-weight:700;}
  .cal-today{border:1px solid var(--line);background:#fff;color:var(--primary-d);font-size:13px;font-weight:600;
    border-radius:20px;padding:6px 13px;min-height:34px;cursor:pointer;font-family:inherit;transition:background .15s,transform .12s;}
  .cal-today:hover{background:var(--primary-light);}
  .cal-today:active{transform:scale(.95);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
  .cal-week div{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:5px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--text);
    border:2px solid transparent;background:transparent;padding:2px;min-height:48px;
    -webkit-user-select:none;user-select:none;
    transition:transform .12s ease,background .18s,border-color .18s,color .18s;}
  .cal-day:hover{background:var(--bg);}
  .cal-day:active{transform:scale(.92);}
  .cal-day.other-month{color:#ccc;}
  .cal-day.today{border-color:var(--primary-d);}
  .cal-day .dnum{font-size:14px;font-weight:600;line-height:1.05;}
  .cal-day .dw{font-size:10px;line-height:1.1;font-weight:600;opacity:.9;margin-top:1px;}
  .cal-day.checked{background:var(--primary);color:#fff;border-color:var(--primary);}
  .cal-day.checked .dw{color:#fff0f7;}
  .cal-day .dcheck{width:13px;height:13px;margin-top:2px;color:inherit;animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
  .cal-summary{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .cal-summary .cs{background:var(--bg);border-radius:12px;padding:10px 16px;text-align:center;flex:1;min-width:90px;}
  .cal-summary .cs b{font-size:20px;color:var(--primary-d);}
  .cal-summary .cs small{display:block;font-size:12px;color:var(--muted);}

  /* 弹窗记录 */
  .modal-mask{position:fixed;inset:0;background:rgba(15,30,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:0;}
  .modal-mask.show{display:flex;animation:fadeIn .2s ease;}
  @media(min-width:560px){.modal-mask{align-items:center;}}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 24px rgba(0,0,0,.18);animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head .md{font-size:17px;font-weight:700;}
  .modal-x{border:none;background:var(--bg);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;font-family:inherit;transition:background .15s;}
  .modal-x:hover{background:#e6ecea;}
  .modal-body{display:flex;flex-direction:column;gap:18px;}
  .modal-ex{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .modal-ex label{font-size:15px;font-weight:600;}
  .ex-toggle{border:2px solid var(--line);background:#fff;color:var(--muted);font-size:15px;font-weight:700;
    border-radius:12px;padding:12px 24px;min-height:48px;cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s,transform .12s;}
  .ex-toggle:active{transform:scale(.96);}
  .ex-toggle.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .modal-foot{display:flex;align-items:center;gap:10px;margin-top:22px;}
  .btn-ghost2{background:var(--bg);color:var(--text);}
  .btn-ghost2:hover{background:#e6ecea;}

  .chart-box{width:100%;}
  .chart-box svg{width:100%;height:auto;display:block;animation:fadeIn .4s ease;aspect-ratio:520 / 230;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .rbtn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;font-family:inherit;
    border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer;font-weight:600;transition:background .15s,transform .12s;}
  .rbtn:active{transform:scale(.94);}
  .rbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .foot{padding:22px 0 calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px;}
  .foot button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;font-family:inherit;}

  /* 配色面板 — 居中浮层 */
  .color-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.2);padding:18px;z-index:200;min-width:240px;text-align:center;}
  .color-panel.show{display:block;animation:popIn .2s ease;}
  @keyframes popIn{from{opacity:0;transform:translate(-50%,-45%) scale(.92);}to{opacity:1;transform:translate(-50%,-50%) scale(1);}}
  .color-panel h4{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--text);}
  .color-options{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .color-opt{width:44px;height:44px;border-radius:14px;border:3px solid transparent;cursor:pointer;
    transition:border-color .15s,transform .12s;position:relative;}
  .color-opt:hover{transform:scale(1.1);}
  .color-opt.active{border-color:#333;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .color-opt .c-name{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
    font-size:10px;color:var(--muted);white-space:nowrap;display:none;}

  /* 改名字 — 居中弹窗 */
  .rename-panel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.2);padding:18px;z-index:200;width:260px;}
  .rename-panel.show{display:block;animation:popIn .2s ease;}
  .rename-panel h4{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--text);text-align:center;}
  .rename-panel input{width:100%;min-height:44px;font-size:16px;font-family:inherit;border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;outline:none;box-sizing:border-box;color:var(--text);background:#fff;}
  .rename-panel input:focus{border-color:var(--primary);}
  .rename-panel .rn-actions{display:flex;gap:10px;margin-top:16px;}
  .rename-panel .rn-actions button{flex:1;min-height:44px;border:none;border-radius:10px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;transition:transform .12s;}
  .rename-panel .rn-actions button:active{transform:scale(.96);}
  .rename-panel .rn-ok{background:var(--primary);color:#fff;}
  .rename-panel .rn-cancel{background:var(--bg);color:var(--text);}

  /* BMI 行 */
  .ov-bmi{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--bg);border-radius:14px;padding:11px 14px;cursor:pointer;transition:background .15s;}
  .ov-bmi:active{background:#eef0ec;}
  .ov-bmi .bmi-main{display:flex;align-items:baseline;gap:8px;}
  .ov-bmi .bmi-val{font-size:22px;font-weight:800;color:var(--primary-d);}
  .ov-bmi .bmi-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--primary-light);color:var(--primary-d);}
  .ov-bmi .bmi-hint{font-size:12px;color:var(--muted);}

  /* 生理期标记 */
  /* 日历标签点（顶部，与右下角锻炼✓区分） */
  .cal-day .tags{position:absolute;top:3px;left:3px;right:18px;display:flex;gap:3px;flex-wrap:wrap;}
  .cal-day .tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .tdot.t-period{background:#e84393;}
  .tdot.t-eatout{background:#f39c12;}
  .cal-day.checked .tdot{box-shadow:0 0 0 1px rgba(255,255,255,.55);}
  /* 记录弹窗标签芯片 */
  .tag-row{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap;}
  .tag-chip{flex:1;min-width:60px;border:1.5px solid var(--line);background:#fff;color:var(--muted);
    border-radius:12px;padding:9px 6px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
    transition:all .12s;min-height:44px;}
  .tag-chip.on.t-period{border-color:#e84393;color:#e84393;background:#fdeaf4;}
  .tag-chip.on.t-eatout{border-color:#f39c12;color:#f39c12;background:#fef3e2;}
  /* 趋势图点详情 */
  .point-info{display:none;margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--bg);}
  .point-info.show{display:block;animation:fadeIn .25s ease;}
  .point-info .pi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .point-info .pi-date{font-size:13px;font-weight:700;color:var(--primary-d);}
  .point-info .pi-close{border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
  .point-info .pi-w{font-size:15px;font-weight:700;margin-bottom:8px;}
  .point-info .pi-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
  .pi-chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .pi-chip.t-period{color:#e84393;background:#fdeaf4;}
  .pi-chip.t-eatout{color:#f39c12;background:#fef3e2;}
  .point-info .pi-note{font-size:13px;color:var(--muted);line-height:1.5;display:none;}


  /* 鼓励文案 */
  .encourage{margin-top:13px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);line-height:1.5;}
  .encourage b{color:var(--primary-d);}

  /* 空状态引导 */
  .empty-guide{display:none;background:linear-gradient(135deg,var(--primary-light),#fff);border:2px dashed var(--line);
    border-radius:16px;padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;margin-top:12px;line-height:1.6;}
  .empty-guide.show{display:block;animation:fadeIn .3s ease;}
  .empty-guide b{color:var(--primary-d);}

  /* 目标达成 / 掉秤庆祝 */
  .celebrate{position:fixed;inset:0;background:rgba(20,15,25,.55);display:none;align-items:center;justify-content:center;z-index:300;padding:24px;}
  .celebrate.show{display:flex;animation:fadeIn .3s ease;}
  .celebrate .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .celebrate .confetti i{position:absolute;top:-24px;display:block;opacity:0;border-radius:2px;animation:confettiFall linear forwards;}
  @keyframes confettiFall{0%{transform:translateY(-24px) rotate(0);opacity:0;}10%{opacity:1;}100%{transform:translateY(110vh) rotate(var(--r));opacity:.95;}}
  .celebrate .c-box{position:relative;background:#fff;border-radius:22px;padding:30px 26px;text-align:center;max-width:320px;width:100%;
    animation:popIn2 .45s cubic-bezier(.18,.89,.32,1.28);box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden;}
  @keyframes popIn2{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
  .celebrate .c-icon{width:64px;height:64px;color:var(--primary);margin:0 auto;animation:bounceIn .6s ease;}
  @keyframes bounceIn{0%{transform:scale(0) rotate(-20deg);}55%{transform:scale(1.2) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  .celebrate .c-icon svg{width:64px;height:64px;display:block;}
  .celebrate .c-title{font-size:21px;font-weight:800;color:var(--primary-d);margin:14px 0 8px;line-height:1.3;}
  .celebrate .c-sub{font-size:14px;color:var(--muted);line-height:1.6;}
  .celebrate .c-sub b{color:var(--primary-d);}
  .celebrate .c-btn{margin-top:20px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:700;
    font-family:inherit;border-radius:12px;padding:11px 30px;min-height:44px;cursor:pointer;transition:transform .12s;}
  .celebrate .c-btn:active{transform:scale(.95);}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span id="brandName">萍小宝体重日记</span>
    </div>
    <div class="tools">
      <button class="btn btn-ghost" id="btnColor" title="换颜色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10H12V2z"/></svg>配色</button>
      <button class="btn btn-ghost" id="btnRename" title="改名字"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>改名字</button>
      <button class="btn btn-ghost" id="btnUnit" title="切换单位"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span id="unitLabel">斤</span></button>
      <button class="btn btn-ghost" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4l4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>备份</button>
      <button class="btn btn-ghost" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>恢复</button>
    </div>
    <div class="color-panel" id="colorPanel">
      <h4>选择主题配色</h4>
      <div class="color-options" id="colorOptions"></div>
    </div>
    <div class="rename-panel" id="renamePanel">
      <h4>修改名称</h4>
      <input type="text" id="renameInput" maxlength="20" placeholder="输入新名称">
      <input type="text" id="nickInput" maxlength="10" placeholder="被夸时怎么称呼（如 萍小宝）">
      <div class="rn-actions">
        <button class="rn-cancel" id="renameCancel">取消</button>
        <button class="rn-ok" id="renameOk">确定</button>
      </div>
    </div>
    <div class="rename-panel" id="goalPanel">
      <h4>设置目标体重</h4>
      <input type="number" id="goalInput" step="0.1" inputmode="decimal" placeholder="如 110">
      <div class="rn-actions">
        <button class="rn-cancel" id="goalCancel">取消</button>
        <button class="rn-ok" id="goalOk">保存</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="backupBanner"></div>
  <div class="empty-guide" id="emptyGuide"></div>

  <section class="overview">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M4 9a8 8 0 0 1 16 0v6a8 8 0 0 1-16 0z"/><path d="M12 9v6"/></svg>体重概览</h2>
    <div class="ov-grid" id="ovGrid"></div>
    <div class="ov-bmi" id="ovBmi"></div>
  </section>

  <section class="card" id="sec-checkin">
    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>运动日历</h3>
    <p style="margin:0 0 12px;color:var(--muted);font-size:13px;">点击任意日期，弹出窗口记录当天体重、选择是否锻炼；格子里的数字是那天记的体重。</p>
    <div class="cal-nav">
      <button class="nav-btn" id="calPrev" aria-label="上个月">&lt;</button>
      <span class="cal-title" id="calTitle">2026年8月</span>
      <button class="nav-btn" id="calNext" aria-label="下个月">&gt;</button>
      <button class="cal-today" id="calToday">回到今天</button>
    </div>
    <div class="cal-week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-summary" id="calSummary"></div>
  </section>

  <section class="card" id="sec-trend">
    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 17.5h11M4 9a8 8 0 0 1 16 0v6a8 8 0 0 1-16 0z"/><path d="M12 9v6"/></svg>体重趋势</h3>
    <div style="display:flex;gap:8px;margin:0 0 8px;align-items:center;">
      <span style="font-size:13px;color:var(--muted);font-weight:600;">体重曲线</span>
      <div style="margin-left:auto;display:flex;gap:5px;" id="rangeCtl">
        <button class="rbtn active" data-r="all">全部</button>
        <button class="rbtn" data-r="7">近7天</button>
        <button class="rbtn" data-r="30">近30天</button>
      </div>
    </div>
    <div class="chart-box" id="weightChart" style="margin-top:8px;margin-bottom:4px;"></div>
    <div class="point-info" id="pointInfo">
      <div class="pi-head"><span class="pi-date" id="piDate"></span><button class="pi-close" id="piClose" type="button" aria-label="关闭">×</button></div>

      <div class="pi-tags" id="piTags"></div>
      <div class="pi-note" id="piNote"></div>
    </div>
    <div class="encourage" id="encourage"></div>

  <div class="foot">
    数据仅存本机浏览器 · <button id="btnClear">清空全部数据</button>
  </div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <span class="md" id="modalDate"></span>
      <button class="modal-x" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>体重 (<span id="mUnit">斤</span>)</label><input type="number" id="mWeight" step="0.1" inputmode="decimal" placeholder="如 110.0"></div>
      <div class="modal-ex"><label>是否锻炼</label><button class="ex-toggle" id="mEx" type="button">未锻炼</button></div>
      <div class="tag-row">
        <button class="tag-chip t-period" id="mPeriod" type="button">🌸 生理期</button>
        <button class="tag-chip t-eatout" id="mEatout" type="button">🍔 放纵餐</button>
      </div>
      <div class="field"><label>备注</label><input type="text" id="mNote" placeholder="可选填，如今天管住嘴了～"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="mDelete" type="button" style="display:none;">删除</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost2" id="mCancel" type="button">取消</button>
      <button class="btn btn-primary" id="mSave" type="button">保存</button>
    </div>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <div class="confetti" id="confetti"></div>
  <div class="c-box">
    <div class="c-icon" id="cIcon"></div>
    <div class="c-title" id="cTitle"></div>
    <div class="c-sub" id="cSub"></div>
    <button class="c-btn" id="celebrateClose">太棒了</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var PREFIX="wb_weight_lite_";
  var K={weights:PREFIX+"weights",checkins:PREFIX+"checkins",seeded:PREFIX+"seeded",goal:PREFIX+"goal",name:PREFIX+"name",theme:PREFIX+"theme",unit:PREFIX+"unit",height:PREFIX+"height",celebrated:PREFIX+"celebrated",celebratedGoal:PREFIX+"celebratedGoal",nick:PREFIX+"nick"};
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function pad(n){return n<10?"0"+n:""+n;}
  function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function today(){return fmt(new Date());}
  function shiftDay(ds,delta){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+delta);return fmt(d);}
  function $(id){return document.getElementById(id);}

  var weights=load(K.weights,[]);
  weights=weights.filter(function(w){return w&&w.weight!=null;}); // 清洗历史脏数据
  var checkins=load(K.checkins,{});
  var goalWeight=load(K.goal,null);
  // 单位：内部统一以 kg 存储，显示按当前单位换算（1kg=2斤）
  var curUnit=load(K.unit,"jin");
  function dispUnit(){return curUnit==="jin"?"斤":"kg";}
  function toDisp(w){return w==null?null:(curUnit==="jin"?w*2:w);}
  function fromDisp(v){return curUnit==="jin"?v/2:v;}
  var appName=load(K.name,"萍小宝体重日记");
  var heightCm=load(K.height,null);
  function bmiInfo(){
    var lw=latestWeight();
    if(!lw||!heightCm)return null;
    var m=heightCm/100;
    var bmi=lw.weight/(m*m);
    var tag="正常";
    if(bmi<18.5)tag="偏瘦";
    else if(bmi<24)tag="正常";
    else if(bmi<28)tag="偏胖";
    else tag="肥胖";
    return {bmi:bmi,tag:tag};
  }

  // 主题配色 — 小清新马卡龙（参考设计宝典 9 色）
  var themes={
    peachsea:{name:"桃海蓝",primary:"#6cb8d8",dark:"#3a8cb8",light:"#e8f4fa",bg:"#f5fafc",line:"#c8e0e8",muted:"#6a8a98",text:"#1f3038",gradientEnd:"#a0d8e0"},
    passion:{name:"百香果",primary:"#e8909a",dark:"#c4405b",light:"#fff8f0",bg:"#fff5ee",line:"#f0d8cc",muted:"#b07868",text:"#3d2520",gradientEnd:"#f5c8b8"},
    cool:{name:"清凉一夏",primary:"#7ec8a8",dark:"#4eb088",light:"#eaf7f1",bg:"#f5faf7",line:"#cce8d8",muted:"#6a9a82",text:"#1f3d2d",gradientEnd:"#b8e8d0"},
    pinkblue:{name:"粉蓝冰棍",primary:"#f0a0c0",dark:"#d87898",light:"#fce8f2",bg:"#fef5f8",line:"#f0d0dd",muted:"#b08898",text:"#3d2030",gradientEnd:"#a0d8e8"},
    grass:{name:"小草温柔",primary:"#90c8a8",dark:"#68a888",light:"#fce8ec",bg:"#f8faf5",line:"#d8e8d8",muted:"#88a088",text:"#2d3830",gradientEnd:"#f0d8b8"},
    bluesky:{name:"昨日青空",primary:"#a8a0e0",dark:"#7a72c8",light:"#f0f0fa",bg:"#f8f8fc",line:"#d8d8e8",muted:"#8888a8",text:"#28283d",gradientEnd:"#b0d0f0"},
    youth:{name:"布衣少年",primary:"#e8a078",dark:"#d47850",light:"#fef0e8",bg:"#fdf8f5",line:"#f0d8c8",muted:"#b08868",text:"#3d2820",gradientEnd:"#f5d8b0"},
    girl:{name:"少女幻色",primary:"#e8a0c8",dark:"#d078b0",light:"#eaf8ea",bg:"#fafef8",line:"#e2ddd8",muted:"#90a088",text:"#302d38",gradientEnd:"#d8c0f0"},
    romance:{name:"青涩浪漫",primary:"#8cc0a0",dark:"#68a880",light:"#f0f8e8",bg:"#f8fcf8",line:"#d8e8d8",muted:"#88a090",text:"#2d3830",gradientEnd:"#f0c8b0"}
  };
  var curTheme=load(K.theme,"girl");
  function applyTheme(name){
    var t=themes[name];if(!t)return;
    var root=document.documentElement;
    ["primary","primary-d","primary-light","bg","line","muted","text"].forEach(function(k){
      if(t[k])root.style.setProperty("--"+k,t[k]);
    });
    // 同步顶部渐变
    var hdr=document.querySelector("header.top");
    if(hdr)hdr.style.background="linear-gradient(135deg,"+t.primary+","+(t.gradientEnd||t.light)+")";
    // 同步 theme-color meta
    var tm=document.querySelector('meta[name="theme-color"]');
    if(tm)tm.content=t.primary;
    save(K.theme,name);
    drawWeightChart();
  }

  // 应用名字到标题栏
  function applyName(){
    document.title=appName;
    var el=document.getElementById("brandName");
    if(el)el.textContent=appName;
  }
  // 昵称：从 App 名取掉「体重日记」后缀，用于夸奖文案（如「萍小宝体重日记」→「萍小宝」）
  var savedNick=load(K.nick,"");
  function nick(){return savedNick||(appName||"").replace(/体重日记$/,"");}

  // 发布版不预置示例数据，首开走空状态引导（女生看到的是干净的入门页）
  function persist(){save(K.weights,weights);save(K.checkins,checkins);}

  function latestWeight(){var v=weights.filter(function(w){return w.weight!=null;});if(!v.length)return null;var s=v.slice().sort(function(a,b){return a.date<b.date?-1:1;});return s[s.length-1];}
  function lostAll(){var v=weights.filter(function(w){return w.weight!=null;});if(!v.length)return null;var s=v.slice().sort(function(a,b){return a.date<b.date?-1:1;});return s[0].weight-s[s.length-1].weight;}
  // checkins 简化为日期→布尔（是否运动）
  function isExercised(ds){return !!checkins[ds];}
  function weightOn(ds){var w=weights.find(function(x){return x.date===ds;});return w?w.weight:null;}

  function renderOverview(){
    var box=$("ovGrid");
    var lw=latestWeight();
    var current=lw?lw.weight:null;
    // 目标体重
    var goal=goalWeight;
    // 差值
    var diff=null;
    if(current!==null&&goal!==null){
      diff=current-goal;
      if(Math.abs(diff)<0.01)diff=0;
    }
    var u=dispUnit();
    // 累计减重：最早一条记录 - 最新一条记录
    var startW=null;
    var validW=weights.filter(function(w){return w.weight!=null;});
    if(validW.length){
      var sortedAll=validW.slice().sort(function(a,b){return a.date<b.date?-1:1;});
      startW=sortedAll[0].weight;
    }
    var lost=null;
    if(startW!==null&&current!==null)lost=startW-current;
    var lostLabel="累计减重",lostVal="--",lostCls="lost";
    if(lost!==null){
      if(lost>0){lostVal=toDisp(lost).toFixed(1);}
      else if(lost<0){lostVal=toDisp(-lost).toFixed(1);lostCls="lost up";lostLabel="累计增重";}
      else{lostVal="0.0";}
    }
    var goalCell='<div class="ov-item ov-goal" id="ovSetGoal">'
      +'<div class="ov-val target">'+(goal!==null?toDisp(goal).toFixed(1):'--')+'</div>'
      +'<div class="ov-label">目标体重 '+u+'</div>'
      +'</div>';
    box.innerHTML=''
      +'<div class="ov-item">'
        +'<div class="ov-val current">'+(current!==null?toDisp(current).toFixed(1):'--')+'</div>'
        +'<div class="ov-label">当前体重 '+u+'</div>'
      +'</div>'
      +goalCell
      +'<div class="ov-item">'
        +'<div class="ov-val '+(diff!==null&&(diff<=0?' goal-done':(diff>0?' down':'')))+'">'+(diff===null?'--':(diff<=0?'✅ 已达成':toDisp(diff).toFixed(1)))+'</div>'
        +'<div class="ov-label">'+(diff!==null&&diff<=0?'已达成':('距目标 '+u))+'</div>'
      +'</div>'
      +'<div class="ov-item">'
        +'<div class="ov-val '+lostCls+'">'+lostVal+'</div>'
        +'<div class="ov-label">'+lostLabel+' '+u+'</div>'
      +'</div>';
    $("ovSetGoal").addEventListener("click",openGoalModal);
  }

  function renderWeight(){ drawWeightChart(); }

  function renderBmi(){
    var el=$("ovBmi");if(!el)return;
    if(heightEditing)return; // 编辑中不打断输入框
    var info=bmiInfo();
    if(!info){
      el.innerHTML='<span class="bmi-hint">点这里填身高，看看 BMI</span><span class="bmi-hint">设置 ›</span>';
      return;
    }
    el.innerHTML='<div class="bmi-main"><span class="ov-label" style="margin:0">BMI</span><span class="bmi-val">'+info.bmi.toFixed(1)+'</span><span class="bmi-tag">'+info.tag+'</span></div><span class="bmi-hint">'+heightCm+'cm ›</span>';
  }
  var heightEditing=false;
  function editHeight(){
    var el=$("ovBmi");if(!el||heightEditing)return;
    heightEditing=true;
    el.innerHTML='<div class="ov-edit" style="flex-direction:row;justify-content:space-between;">'
      +'<input type="number" id="ovHeightInput" step="1" inputmode="numeric" value="'+(heightCm!=null?heightCm:'')+'" placeholder="如 165" style="width:92px">'
      +'<button class="ov-ok" id="ovHeightOk" type="button">保存</button>'
      +'</div>';
    var inp=$("ovHeightInput");
    setTimeout(function(){inp.focus();},30);
    function commit(e){
      if(e&&e.stopPropagation)e.stopPropagation(); // 阻止冒泡到 BMI 卡片再次打开编辑
      var v=parseFloat(inp.value.trim());
      if(isNaN(v)||v<100||v>250){alert("请输入有效身高(cm)，100-250");return;}
      heightCm=v;save(K.height,v);heightEditing=false;renderBmi();
    }
    $("ovHeightOk").addEventListener("click",commit);
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"){if(e.stopPropagation)e.stopPropagation();commit(e);}});
  }
  function avg(arr){var s=0;arr.forEach(function(x){s+=x.weight;});return s/arr.length;}
  function renderEncourage(){
    var el=$("encourage");if(!el)return;
    if(!weights.length){el.innerHTML="开始记录，见证自己的变化";return;}
    var n=weights.length;
    var lost=lostAll();
    var txt="已坚持记录 <b>"+n+"</b> 天";
    if(lost!==null&&lost>0)txt+=" · 累计减重 <b>"+toDisp(lost).toFixed(1)+"</b> "+dispUnit();
    txt+=" · 继续加油";
    el.innerHTML=txt;
  }
  function renderEmpty(){
    var g=$("emptyGuide");if(!g)return;
    if(!weights.length&&!Object.keys(checkins).length){
      g.classList.add("show");
      g.innerHTML="还没有记录哦～点击上方「运动日历」里任意日期，记下第一天体重吧";
    }else g.classList.remove("show");
  }

  var rangeMode="all";
  function drawWeightChart(){
    var box=$("weightChart");
    var wsAll=weights.filter(function(w){return w.weight!=null;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var ws=wsAll;
    if(rangeMode!=="all"){
      var days=parseInt(rangeMode,10);
      var cut=shiftDay(today(),-(days-1));
      ws=wsAll.filter(function(w){return w.date>=cut;});
    }
    if(ws.length<2){box.innerHTML='<div class="empty">记录至少 2 天体重后，这里会显示趋势</div>';return;}
    var W=520,H=230,padL=38,padR=14,padT=14,padB=38;
    var vals=ws.map(function(w){return w.weight;});
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
    if(min===max){min-=1;max+=1;}
    var range=max-min;var n=ws.length;
    function X(i){return padL+(W-padL-padR)*(n===1?0.5:i/(n-1));}
    function Y(v){return padT+(H-padT-padB)*(1-(v-min)/range);}
    var p=['<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">'];
    var chartColor=getComputedStyle(document.documentElement).getPropertyValue("--primary").trim()||"#ec4899";
    var gridColor=getComputedStyle(document.documentElement).getPropertyValue("--line").trim()||"#f5d0e4";
    var labelColor=getComputedStyle(document.documentElement).getPropertyValue("--muted").trim()||"#9a6b82";
    for(var g=0;g<=3;g++){var gv=min+range*(g/3),gy=Y(gv);
      p.push('<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="'+gridColor+'" stroke-width="1"/>');
      p.push('<text x="'+(padL-5)+'" y="'+(gy+4)+'" font-size="10" fill="'+labelColor+'" text-anchor="end">'+toDisp(gv).toFixed(1)+'</text>');}
    var lblStep=n<=10?1:Math.ceil(n/10);
    for(var li=0;li<n;li++){
      if(li%lblStep===0||li===n-1){
        p.push('<text x="'+X(li)+'" y="'+(H-9)+'" font-size="9.5" fill="'+labelColor+'" text-anchor="middle">'+ws[li].date.slice(5)+'</text>');
      }
    }
    var wp=ws.map(function(w,i){return (i?"L":"M")+X(i)+" "+Y(w.weight)+" ";}).join("");
    p.push('<path d="'+wp+'" fill="none" stroke="'+chartColor+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>');
    ws.forEach(function(w,i){var cx=X(i),cy=Y(w.weight),ds=w.date;
      p.push('<circle class="wpt" cx="'+cx+'" cy="'+cy+'" r="4.2" fill="'+chartColor+'" data-ds="'+ds+'" style="cursor:pointer"/>');
      p.push('<circle class="wpt-hit" cx="'+cx+'" cy="'+cy+'" r="16" fill="transparent" data-ds="'+ds+'" style="cursor:pointer;pointer-events:all"/>');});
    p.push('</svg>');box.innerHTML=p.join("");
  }
  function hasTag(w,t){if(!w)return false;if(w.tags&&w.tags.indexOf(t)>=0)return true;if(t==='period'&&w.period)return true;return false;}
  var TAG_NAME={period:'生理期',eatout:'放纵餐'};
  function showPointInfo(ds){
    var w=weights.find(function(x){return x.date===ds;});
    var box=$("pointInfo");if(!box)return;
    if(!w){box.classList.remove("show");return;}
    $("piDate").textContent=ds.slice(5)+" 周"+weekday(ds);
    $("piWeight").textContent=w.weight!=null?("体重 "+toDisp(w.weight)+" "+dispUnit()):"未记体重";
    var tags=w.tags?w.tags.slice():(w.period?['period']:[]);
    var th='';tags.forEach(function(t){if(TAG_NAME[t])th+='<span class="pi-chip t-'+t+'">'+TAG_NAME[t]+'</span>';});
    $("piTags").innerHTML=th;
    $("piNote").textContent=w.note||"";
    $("piNote").style.display=w.note?"block":"none";
    box.classList.add("show");
  }
  $("weightChart").addEventListener("click",function(e){
    var c=e.target;if(c&&c.tagName==="circle"&&c.getAttribute("data-ds"))showPointInfo(c.getAttribute("data-ds"));
  });
  $("piClose").addEventListener("click",function(){$("pointInfo").classList.remove("show");});

  // ---- 日历打卡 ----
  var calYear,calMonth; // 当前显示的年月
  function initCal(){
    var now=new Date();
    calYear=now.getFullYear();calMonth=now.getMonth();
  }
  function renderCal(){
    if(calYear==null)initCal();
    $("calTitle").textContent=calYear+"年"+(calMonth+1)+"月";
    var firstDay=new Date(calYear,calMonth,1);
    var startDow=(firstDay.getDay()+6)%7; // 周一为0
    var dim=new Date(calYear,calMonth+1,0).getDate();
    var todayStr=today();
    var grid=$("calGrid");var html="";
    // 上月补位
    var prevDim=new Date(calYear,calMonth,0).getDate();
    for(var i=startDow-1;i>=0;i--){
      html+='<div class="cal-day other-month">'+(prevDim-i)+'</div>';
    }
    // 本月
    for(var d=1;d<=dim;d++){
      var ds=calYear+"-"+pad(calMonth+1)+"-"+pad(d);
      var checked=isExercised(ds);
      var isToday=(ds===todayStr);
      var wv=weightOn(ds);
      var wrec=weights.find(function(x){return x.date===ds;});
      var tagList=wrec?(wrec.tags?wrec.tags.slice():(wrec.period?['period']:[])):[];
      var tagHtml='';
      tagList.forEach(function(t){if(t==='period'||t==='eatout')tagHtml+='<span class="tdot t-'+t+'"></span>';});
      html+='<button class="cal-day'+(checked?" checked":"")+(isToday?" today":"")+'" data-ds="'+ds+'">'
        +(tagHtml?'<span class="tags">'+tagHtml+'</span>':'')
        +'<span class="dnum">'+d+'</span>'
        +(wv!=null?'<span class="dw">'+toDisp(wv)+'</span>':'')
        +(checked?'<svg class="dcheck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>':'')
        +'</button>';
    }
    // 下月补位
    var totalCells=startDow+dim;
    var remain=totalCells%7?(7-totalCells%7):0;
    for(var j=1;j<=remain;j++)html+='<div class="cal-day other-month">'+j+'</div>';
    grid.innerHTML=html;
    // 绑定点击
    Array.prototype.forEach.call(grid.querySelectorAll(".cal-day:not(.other-month)"),function(el){
      el.addEventListener("click",function(){ openModal(el.getAttribute("data-ds")); });
    });
    // 汇总统计
    var streak=0;var td2=new Date();
    while(true){var ds2=fmt(td2);if(isExercised(ds2))streak++;else break;td2.setDate(td2.getDate()-1);if(streak>400)break;}
    var monthDone=0;
    for(var k=1;k<=dim;k++){var mds=calYear+"-"+pad(calMonth+1)+"-"+pad(k);if(isExercised(mds))monthDone++;}
    var totalDays=0;for(var ck in checkins){if(checkins[ck]===true)totalDays++;}
    $("calSummary").innerHTML=''
      +'<div class="cs"><b>'+streak+'</b><small>连续锻炼天</small></div>'
      +'<div class="cs"><b>'+monthDone+'/'+dim+'</b><small>本月已练</small></div>'
      +'<div class="cs"><b>'+totalDays+'</b><small>累计锻炼天</small></div>';
  }
  $("calPrev").addEventListener("click",function(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();});
  $("calNext").addEventListener("click",function(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();});
  $("calToday").addEventListener("click",function(){var now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();renderCal();});

  // ---- 弹窗记录（体重 + 是否锻炼）----
  var modalDs=null, mExOn=false, mTags=[];
  function weekday(ds){var p=ds.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);var w=["日","一","二","三","四","五","六"];return w[d.getDay()];}
  function openModal(ds){
    modalDs=ds;
    var w=weights.find(function(x){return x.date===ds;});
    $("mWeight").value=w?toDisp(w.weight):"";
    $("mUnit").textContent=dispUnit();
    $("mWeight").placeholder=curUnit==="jin"?"如 110.0":"如 55.0";
    mExOn=!!checkins[ds];
    syncExBtn();
    mTags=w?(w.tags?w.tags.slice():(w.period?['period']:[])):[];
    syncTagChips();
    $("mNote").value=w&&w.note?w.note:"";
    $("modalDate").textContent=ds.slice(5)+" 周"+weekday(ds);
    var has=(w||Object.prototype.hasOwnProperty.call(checkins,ds));
    $("mDelete").style.display=has?"":"none";
    $("modalMask").classList.add("show");
    setTimeout(function(){$("mWeight").focus();},60);
  }
  function closeModal(){$("modalMask").classList.remove("show");}
  function syncExBtn(){var b=$("mEx");b.classList.toggle("on",mExOn);b.textContent=mExOn?"已锻炼":"未锻炼";}
  function syncTagChips(){["period","eatout"].forEach(function(t){var b=$("m"+t.charAt(0).toUpperCase()+t.slice(1));if(b)b.classList.toggle("on",mTags.indexOf(t)>=0);});}
  $("mEx").addEventListener("click",function(){mExOn=!mExOn;syncExBtn();});
  function toggleTag(t){var i=mTags.indexOf(t);if(i>=0)mTags.splice(i,1);else mTags.push(t);syncTagChips();}
  $("mPeriod").addEventListener("click",function(){toggleTag("period");});
  $("mEatout").addEventListener("click",function(){toggleTag("eatout");});
  $("modalClose").addEventListener("click",closeModal);
  $("mCancel").addEventListener("click",closeModal);
  $("modalMask").addEventListener("click",function(e){if(e.target===this)closeModal();});
  $("mSave").addEventListener("click",function(){
    var ds=modalDs;if(!ds)return;
    var wv=$("mWeight").value.trim();
    var raw=wv===""?null:parseFloat(wv);
    if(raw!==null&&(isNaN(raw)||raw<=0)){alert("请输入有效体重");return;}
    var prevKg=prevEntryWeight(ds);
    var note=$("mNote").value.trim();
    var ex=weights.findIndex(function(x){return x.date===ds;});
    if(raw!==null){
      var val=fromDisp(raw);
      if(ex>=0){weights[ex].weight=val;weights[ex].tags=mTags;weights[ex].note=note;}
      else weights.push({id:uid(),date:ds,weight:val,tags:mTags,note:note,seed:false});
      checkins[ds]=mExOn;
      persist();closeModal();renderAll();
      maybeCelebrate(val,prevKg,ds);
    }else{
      // 体重清空：删除该天体重记录（保留锻炼打卡），不创建 weight:null 污染趋势图
      if(ex>=0){weights=weights.filter(function(x){return x.date!==modalDs;});}
      checkins[ds]=mExOn;
      persist();closeModal();renderAll();
    }
  });
  $("mDelete").addEventListener("click",function(){
    if(!confirm("删除这一天的体重和锻炼记录？"))return;
    weights=weights.filter(function(x){return x.date!==modalDs;});
    delete checkins[modalDs];
    persist();closeModal();renderAll();
  });

  Array.prototype.forEach.call(document.querySelectorAll("#rangeCtl .rbtn"),function(b){
    b.addEventListener("click",function(){
      rangeMode=b.getAttribute("data-r");
      Array.prototype.forEach.call(document.querySelectorAll("#rangeCtl .rbtn"),function(x){x.classList.remove("active");});
      b.classList.add("active");
      drawWeightChart();
    });
  });

  // 日历打卡事件已在 renderCal 中绑定

  function updateBackup(){var total=weights.length+Object.keys(checkins).length;var b=$("backupBanner");
    if(total>=30){b.style.display="block";b.innerHTML="数据已累计 "+total+" 条，建议点右上角「备份」保存到本地。";}else b.style.display="none";}

  function download(fn,content,mime){var blob=new Blob([content],{type:mime||"text/plain"});var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},500);}

  $("btnExport").addEventListener("click",function(){
    download("萍小宝体重日记_"+today()+".json",JSON.stringify({_type:"pingxb-weight",weights:weights,checkins:checkins},null,2),"application/json");
  });
  $("btnImport").addEventListener("click",function(){
    var inp=document.createElement("input");inp.type="file";inp.accept="application/json";inp.style.display="none";document.body.appendChild(inp);
    inp.addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
      r.onload=function(){try{var d=JSON.parse(r.result);if(!confirm("导入将覆盖当前数据，确定？"))return;
        weights=d.weights||[];checkins=d.checkins||{};persist();renderAll();alert("导入成功");}catch(err){alert("文件格式不正确");}};
      r.readAsText(f);document.body.removeChild(inp);});
    inp.click();
  });
  // 清示例已移除（按钮已从工具栏删除）

  $("btnClear").addEventListener("click",function(){
    if(!confirm("⚠️ 将清空全部体重和打卡数据，无法恢复！\n确定？"))return;
    if(!confirm("再确认一次：所有本地数据将永久删除。继续？"))return;
    weights=[];checkins={};save(K.celebrated,false);save(K.celebratedGoal,false);persist();renderAll();
  });

  // ===== 配色面板 =====
  function renderColorOptions(){
    var box=$("colorOptions");box.innerHTML="";
    var names=Object.keys(themes);
    names.forEach(function(name){
      var t=themes[name];
      var btn=document.createElement("button");
      btn.className="color-opt"+(name===curTheme?" active":"");
      btn.style.background=t.primary;
      btn.title=t.name;
      btn.setAttribute("data-theme",name);
      btn.addEventListener("click",function(){
        curTheme=name;applyTheme(name);
        renderColorOptions();
        setTimeout(function(){$("colorPanel").classList.remove("show");},200);
      });
      box.appendChild(btn);
    });
  }
  $("btnColor").addEventListener("click",function(e){
    e.stopPropagation();
    $("colorPanel").classList.toggle("show");
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest("#btnColor")&&!e.target.closest("#colorPanel")){
      $("colorPanel").classList.remove("show");
    }
    if($("renamePanel").classList.contains("show")&&!e.target.closest("#btnRename")&&!e.target.closest("#renamePanel")){
      closeRename();
    }
    if($("goalPanel").classList.contains("show")&&!e.target.closest("#ovSetGoal")&&!e.target.closest("#goalPanel")){
      closeGoalModal();
    }
  });

  // ===== 改名字（居中弹窗）=====
  $("btnRename").addEventListener("click",function(e){
    e.stopPropagation();
    $("renameInput").value=appName;
    $("nickInput").value=savedNick;
    $("renamePanel").classList.add("show");
    setTimeout(function(){$("renameInput").focus();$("renameInput").select();},60);
  });
  function closeRename(){$("renamePanel").classList.remove("show");}
  $("renameOk").addEventListener("click",function(){
    var val=$("renameInput").value.trim();
    if(val)appName=val;
    savedNick=$("nickInput").value.trim();
    save(K.name,appName);
    save(K.nick,savedNick);
    applyName();
    closeRename();
  });
  $("renameCancel").addEventListener("click",closeRename);
  $("renameInput").addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){$("renameOk").click();}
    if(ev.key==="Escape"){closeRename();}
  });

  // ---- 目标体重弹窗 ----
  function openGoalModal(){
    var gp=$("goalPanel");
    var inp=$("goalInput");
    inp.value=goalWeight!==null?toDisp(goalWeight):"";
    inp.placeholder=dispUnit()==="斤"?"如 110":"如 55";
    gp.classList.add("show");
    setTimeout(function(){inp.focus();},60);
  }
  function closeGoalModal(){$("goalPanel").classList.remove("show");}
  $("goalOk").addEventListener("click",function(){
    var v=parseFloat($("goalInput").value.trim());
    if(isNaN(v)||v<=0){alert("请输入有效的目标体重");return;}
    goalWeight=fromDisp(v);save(K.goal,fromDisp(v));
    closeGoalModal();renderOverview();checkGoalCelebrate();
  });
  $("goalCancel").addEventListener("click",closeGoalModal);
  $("goalInput").addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){$("goalOk").click();}
    if(ev.key==="Escape"){closeGoalModal();}
  });

  // 单位切换
  $("btnUnit").addEventListener("click",function(e){
    e.stopPropagation();
    curUnit=curUnit==="jin"?"kg":"jin";
    save(K.unit,curUnit);
    $("unitLabel").textContent=dispUnit();
    renderAll();
  });

  // ===== 夸奖庆祝系统 =====
  var trophySVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
  var starSVG='<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.5L12 17.8 6.1 20.2l1.2-6.5L2.5 9l6.6-.9z"/></svg>';
  var dropPraises=[
    "你这毅力，萍小宝最棒的 💪",
    "稳稳往下掉，继续冲呀 ✨",
    "一斤一斤瘦下来，太厉害了 🎉",
    "哇又轻了一斤！萍小宝冲冲冲 💖",
    "这曲线，萍小宝美翻了 🌟"
  ];
  function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
  // 全屏彩带
  function spawnConfetti(kind){
    var box=$("confetti");if(!box)return;
    box.innerHTML="";
    var base=[cssVar("--primary")||"#e8a0c8",cssVar("--gradientEnd")||"#d8c0f0","#ffd166","#06d6a0","#ef476f","#118ab2","#fca311","#a0e8af"];
    var n=kind==="goal"?90:50;
    for(var i=0;i<n;i++){
      var p=document.createElement("i");
      p.style.left=(Math.random()*100)+"%";
      var w=6+Math.random()*7;
      p.style.width=w+"px";p.style.height=(w*0.42)+"px";
      p.style.background=base[i%base.length];
      p.style.setProperty("--r",(Math.random()*720-360)+"deg");
      p.style.animationDuration=(1.8+Math.random()*1.6)+"s";
      p.style.animationDelay=(Math.random()*0.4)+"s";
      box.appendChild(p);
    }
    setTimeout(function(){if(box)box.innerHTML="";},3600);
  }
  function showCelebrate(mode,newKg,prevKg){
    var el=$("celebrate");if(!el)return;
    if(mode==="goal"){
      $("cIcon").innerHTML=trophySVG;
      $("cTitle").innerHTML="🎉 达成目标啦！";
      var lost=lostAll();
      $("cSub").innerHTML=nick()+"你超棒的！从开始已累计减重 <b>"+(lost!=null?toDisp(lost).toFixed(1):"0.0")+"</b> "+dispUnit()+"啦";
      spawnConfetti("goal");
    }else{
      $("cIcon").innerHTML=starSVG;
      var dropKg=prevKg-newKg, dropD=toDisp(dropKg);
      var praise=dropPraises[Math.floor(Math.random()*dropPraises.length)];
      $("cTitle").innerHTML="💪 又轻了 "+dropD.toFixed(1)+dispUnit()+"！";
      $("cSub").innerHTML=nick()+"，"+praise;
      spawnConfetti("drop");
    }
    el.classList.add("show");
  }
  // 上一条记录的体重（日期严格早于 ds 的最新一条）
  function prevEntryWeight(ds){
    var others=weights.filter(function(x){return x.date<ds;});
    if(!others.length)return null;
    others.sort(function(a,b){return a.date<b.date?1:-1;});
    return others[0].weight;
  }
  // 保存后判定要不要夸奖
  function maybeCelebrate(newKg,prevKg,ds){
    if(goalWeight!==null){
      if(newKg<=goalWeight && (prevKg===null || prevKg>goalWeight)){
        showCelebrate("goal",newKg,prevKg);save(K.celebratedGoal,true);return;
      }
      if(prevKg!==null && prevKg<=goalWeight && newKg>goalWeight){save(K.celebratedGoal,false);} // 滑回目标之上，重置
    }
    if(prevKg!==null){
      var drop=prevKg-newKg;
      if(drop>=0.5){ showCelebrate("drop",newKg,prevKg); } // 1斤 = 0.5kg
    }
  }
  // 设置目标体重后，若当前已达标也给个惊喜
  function checkGoalCelebrate(){
    if(goalWeight===null)return;
    var lw=latestWeight();if(!lw)return;
    if(lw.weight<=goalWeight){
      if(!load(K.celebratedGoal,false)){showCelebrate("goal",lw.weight,null);save(K.celebratedGoal,true);}
    }else{save(K.celebratedGoal,false);}
  }
  function closeCelebrate(){var el=$("celebrate");if(el){el.classList.remove("show");var c=$("confetti");if(c)c.innerHTML="";}}
  $("celebrateClose").addEventListener("click",closeCelebrate);
  $("celebrate").addEventListener("click",function(e){if(e.target===this)closeCelebrate();});

  // 初始化
  applyTheme(curTheme);
  renderColorOptions();
  applyName();
  $("unitLabel").textContent=dispUnit();
  $("ovBmi").addEventListener("click",function(){if(!heightEditing)editHeight();});
  function renderAll(){renderOverview();renderBmi();renderWeight();initCal();renderCal();renderEncourage();renderEmpty();updateBackup();}
  renderAll();
  // 页面加载后检查是否已达目标（数据可能已经是达标状态）
  checkGoalCelebrate();
  // 注册 Service Worker：添加到主屏幕后断网也能打开（离线缓存）
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
})();
</script>
</body>
</html>
